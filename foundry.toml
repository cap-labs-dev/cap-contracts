[profile.default]
src = "contracts"
out = "out"
test = "test"
libs = ["node_modules", "lib"]
script = "script"
solc_version = "0.8.36"
evm_version = "osaka"
ignored_warnings_from = ["node_modules/", "lib/", "node_modules/@openzeppelin/"]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
]
fs_permissions = [
    { access = "read-write", path = "./config/cap-v2.json" },
    { access = "read-write", path = "./artifacts/fuzz-and-invariant-tests" },
]
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
ethereum  = "${ETH_RPC_URL}"
monad     = "${MONAD_RPC_URL}"
tempo     = "${TEMPO_RPC_URL}"
megaeth   = "${MEGAETH_RPC_URL}"
katana    = "${KATANA_RPC_URL}"

[invariant]
show_metrics = true
fail_on_revert = true
dictionary_weight = 80
[fuzz]
dictionary_weight = 60
include_storage = true

[fmt]
bracket_spacing = true
int_types = "preserve"
sort_imports = true
single_line_statement_blocks = "preserve"
contract_new_lines = false

[profile.release]
gas_reports = ["*"]
gas_reports_ignore = [
    "MockAdapter",
    "MockAeraVault",
    "MockAggregator",
    "MockCreateX",
    "MockERC20",
    "MockIRM",
    "MockReentrantERC20",
    "MockUtilizationSource",
]
optimizer = true
optimizer_runs = 200
via_ir = true
use_literal_content = true
[profile.release.optimizer_details]
# # https://docs.soliditylang.org/en/v0.8.36/using-the-compiler.html#input-description
peephole = true                               # default true
jumpdestRemover = true                        # default true
simpleCounterForLoopUncheckedIncrement = true # default true
yul = true                                    # default true
# inliner = true                                # default false
# orderLiterals = true # default false
# deduplicate = true # default false
# cse = true # default false
# constantOptimizer = true # default false 

[profile.slither]
via_ir = true

# Fuzz and invariant test profiles; compiler settings are inherited unchanged.
[profile.local.fuzz]
runs = 256
failure_persist_dir = "cache/fuzz"
[profile.local.invariant]
runs = 32
depth = 64
fail_on_revert = true
show_metrics = true
failure_persist_dir = "cache/invariant"

[profile.pr.fuzz]
runs = 1000
failure_persist_dir = "cache/fuzz"
[profile.pr.invariant]
runs = 256
depth = 128
fail_on_revert = true
show_metrics = true
failure_persist_dir = "cache/invariant"

[profile.deep.fuzz]
runs = 10000
failure_persist_dir = "cache/fuzz"
[profile.deep.invariant]
runs = 2048
depth = 256
fail_on_revert = true
show_metrics = true
failure_persist_dir = "cache/invariant"
